  /* Consistency pass 2: frosted cards like the home page, arrow links instead of underlined bullets */
  section.join-block { padding: 28px clamp(20px, 3vw, 36px); margin: 0 0 24px; background: rgba(255,255,255,0.1); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; }
  section.join-block:first-of-type { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.2); }
  section.join-block ul { list-style: none; padding-left: 0; opacity: 1; }
  section.join-block li { margin: 0 0 6px; line-height: 1.5; }
  @font-face { font-family: 'Departure Mono'; src: url('fonts/DepartureMono-Regular.woff2') format('woff2'); font-display: swap; }
  .strand-art { margin: 28px 0 8px; display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px 4px; font-family: 'Departure Mono', ui-monospace, monospace; }

  .bp .rung { width: 3px; height: 16px; background: rgba(255,255,255,.55); }
  .bp.bad .rung { background: repeating-linear-gradient(#ff7b7b 0 3px, transparent 3px 6px); }
  .bp.bad .b.bot { background: #ff7b7b !important; color: #fff; animation: badFlash 1.1s ease-in-out .2s 3; }
  .bp.nick .b.bot { transform: translateX(-5px); }
  .bp.nick + .bp .b.bot { transform: translateX(5px); }
  .nick-label { flex-basis: 100%; font-size: 13px; color: #f08ab8; margin: 2px 0 0; font-family: 'Departure Mono', ui-monospace, monospace; }

  .joke-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  <main>
    <h1>Page not found</h1>
    <p class="intro">That page doesn’t exist, or it has moved.</p>
    <div class="strand-art" id="strand" role="img" aria-label="A DNA double strand trying to pair with the website: one base is mismatched and the strand has a break"></div>
    <p class="no-match" id="noMatch"></p>
    <p class="ligase">This page has a strand break. We’re sending ligase.</p>
    <div class="joke-row"><span id="joke"></span><button type="button" class="joke-btn" id="jokeBtn">Another one</button></div>
    <p><a href="index.html" class="go-link">Re-anneal at home</a></p>
    <p><a href="research.html" class="go-link">Research</a></p>
    <p><a href="publications.html" class="go-link">Publications</a></p>

    <p><a href="#" data-mail class="go-link">Get in touch</a></p>
  </main>
  <script>
    (function () {
      var path = decodeURIComponent(location.pathname + location.search) || '/';
      var B = 'ATGC', COMP = { A: 'T', T: 'A', G: 'C', C: 'G' };
      var COL = { A: '#f08ab8', T: '#cdb8ee', G: '#ffffff', C: '#e58bb0' };
      // the dead address becomes the strand: each character picks a base, so every broken link gives its own sequence
      var seq = [], s = path.replace(/[^a-z0-9]/gi, '') || 'notfound';
      var N = innerWidth < 480 ? 10 : 16;
      for (var i = 0; i < N; i++) seq.push(B[(s.charCodeAt(i % s.length) + i * 7) % 4]);
      var bad = N === 16 ? 9 : 7, nick = N === 16 ? 5 : 3, art = document.getElementById('strand');
      seq.forEach(function (top, i) {
        var bp = document.createElement('div'); bp.className = 'bp' + (i === bad ? ' bad' : '') + (i === nick ? ' nick' : '');
        bp.style.animationDelay = (i * 0.07) + 's';
        var bot = i === bad ? B[(B.indexOf(COMP[top]) + 1) % 4] : COMP[top];
        bp.innerHTML = '<div class="b" style="background:' + COL[top] + '">' + top + '</div><div class="rung"></div><div class="b bot" style="background:' + COL[bot] + '">' + bot + (i === bad ? '' : '') + '</div>';
        art.appendChild(bp);
      });
      var lab = document.createElement('div'); lab.className = 'nick-label'; lab.textContent = 'nick in the lower backbone (base ' + (nick + 1) + ')  ·  mismatch ✕ (base ' + (bad + 1) + ')';
      art.appendChild(lab);
      document.getElementById('noMatch').textContent = 'No complementary sequence found at ' + path;
      var jokes = [
        'Why did the DNA strand get lost? It couldn’t find its complement.',
        '404: sequencing error. Please resubmit your base pairs.',
        'We went looking for this page, but it denatured on the way.',
        'This link was a perfect match. Until base ' + (bad + 1) + '.',
        'Helicase is on its way. It’s unwinding the problem.'
      ], k = 0, el = document.getElementById('joke');
      el.textContent = jokes[0];
      document.getElementById('jokeBtn').addEventListener('click', function () { k = (k + 1) % jokes.length; el.textContent = jokes[k]; });
    })();
  </script>

  <script type="module">
    import { initDnaBackground } from './js/dna-bg.js';
    try { initDnaBackground(); } catch (e) { console.warn(e); }
    import { getStoredMotionPreference, setStoredMotionPreference } from './js/motion-state.js';
    const checkbox = document.getElementById('motionCheckbox');
    const labelState = document.getElementById('motionLabelState');
    const enabled = getStoredMotionPreference();
    if (checkbox) checkbox.checked = enabled;
    if (labelState) labelState.textContent = enabled ? 'On' : 'Off';
    checkbox?.addEventListener('change', () => {
      setStoredMotionPreference(checkbox.checked);
      if (labelState) labelState.textContent = checkbox.checked ? 'On' : 'Off';
    });
  </script>
