<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>News – ExP Lab</title>
<meta name="description" content="News from the ExP Lab at Durham University: papers, people, talks and funding." />
<meta name="theme-color" content="#7D6B9D" />
<meta property="og:title" content="News – ExP Lab" />
<meta property="og:type" content="website" />
<style>
  :root {
    --color-primary: #f08ab8;
    --dna-bg-color: rgba(255,255,255,0.06);
    --color-bg-left: #B8A5D6;
    --color-bg-right: #DBA5CD;
    --color-text-light: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--color-text-light);
    background: linear-gradient(135deg, #7D6B9D 0%, #6A5B8A 100%);
    background-attachment: fixed;
    isolation: isolate;
    min-height: 100vh;
  }
  .dna-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; display: block; }
  .pub-tools { display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; margin:0 0 8px; }
  .pub-search { flex:1 1 220px; min-width:0; font:inherit; font-size:15px; color:#fff; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:9px 16px; }
  .pub-search::placeholder { color:rgba(255,255,255,.65); }
  .pub-search:focus-visible, .pub-year-select:focus-visible, .chip:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .pub-year-select { font:inherit; font-size:15px; color:#fff; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:9px 14px; }
  .pub-year-select option { color:#222; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
  .chip { font:inherit; font-size:14px; font-weight:600; color:#fff; background:transparent; border:1px solid rgba(255,255,255,.4); border-radius:999px; padding:6px 14px; cursor:pointer; }
  .chip[aria-pressed="true"] { background:#fff; color:#4b3d6b; border-color:#fff; }
  .pub-status { font-size:14px; opacity:.85; margin:0 0 6px; min-height:1.4em; }
  .pub-entry[hidden] { display:none; }
  .pub-empty { padding:30px 0; opacity:.9; }
  .news-list { display:flex; flex-direction:column; }
  .news-item { display:grid; grid-template-columns:140px 1fr; gap:30px; padding:24px 0; border-top:1px solid rgba(255,255,255,.25); }
  .news-item:first-child { border-top:none; }
  .news-date { font-size:15px; font-weight:700; opacity:.85; letter-spacing:1px; }
  .news-item h2 { margin:0 0 6px; font-size:clamp(18px,2vw,22px); font-weight:900; }
  .news-item h2 a { color:inherit; text-decoration:none; } .news-item h2 a:hover { text-decoration:underline; }
  .news-item p { margin:0; line-height:1.55; opacity:.95; }
  @media (max-width:600px){ .news-item { grid-template-columns:1fr; gap:4px; } }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 5%;
  }
  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .motion-label {
    color: var(--color-primary);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .motion-label-state { display: inline-block; min-width: 22px; }
  .motion-switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
    cursor: pointer;
    vertical-align: middle;
  }
  .motion-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .motion-slider {
    position: absolute;
    inset: 0;
    background: rgba(178, 45, 100, 0.25);
    border: 1px solid rgba(178, 45, 100, 0.5);
    border-radius: 22px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .motion-slider::before {
    content: '';
    position: absolute;
    height: 16px;
    width: 16px;
    left: 2px;
    top: 2px;
    background: var(--color-primary);
    border-radius: 50%;
    transition: transform 0.2s ease;
  }
  .motion-switch input:checked + .motion-slider {
    background: var(--color-primary);
    border-color: var(--color-primary);
  }
  .motion-switch input:checked + .motion-slider::before {
    background: #fff;
    transform: translateX(18px);
  }
  .back-link {
    color: var(--color-text-light);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    opacity: 0.9;
  }
  .back-link:hover { opacity: 1; }
  .back-link::before { content: '← '; }
  .logo {
    font-weight: 900;
    letter-spacing: -1px;
    font-size: 20px;
  }
  .logo-exp {
    color: var(--color-primary);
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 5% 120px;
  }
  h1 {
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 900;
    letter-spacing: -1px;
    margin: 20px 0 10px;
  }
  .intro {
    font-size: clamp(16px, 1.6vw, 20px);
    max-width: 700px;
    opacity: 0.95;
    margin-bottom: 50px;
  }
  .pub-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .pub-entry {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 30px;
    padding: 26px 0;
    border-top: 1px solid rgba(255,255,255,0.25);
    align-items: start;
  }
  .pub-list .pub-entry:first-child { border-top: none; }
  .pub-year {
    font-size: 15px;
    font-weight: 700;
    opacity: 0.85;
    letter-spacing: 1px;
  }
  .pub-entry h2 {
    margin: 0 0 8px;
    font-size: clamp(18px, 2vw, 22px);
    font-weight: 900;
  }
  .pub-entry p {
    margin: 0;
    font-size: var(--font-size-base, 16px);
    line-height: 1.55;
    opacity: 0.95;
  }
  .pub-entry h2 a { color: inherit; text-decoration: none; }
  .pub-entry h2 a:hover, .pub-entry h2 a:focus-visible { text-decoration: underline; }
  .intro a { color: inherit; text-decoration: underline; }
  .pub-entry .authors { font-size: 14px; opacity: 0.85; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .pub-entry .journal {
    display: inline-block;
    margin-top: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  @media (max-width: 600px) {
    .pub-entry {
      grid-template-columns: 1fr;
      gap: 6px;
    }
  }
</style>
<link rel="stylesheet" href="css/subnav.css?v=p72">
<style id="site-footer-css">.site-footer{padding:28px 16px 22px;text-align:center;font:12px/1.4 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:.02em;color:rgba(255,255,255,.55);position:relative;z-index:1}</style>
</head>
<body data-dna-bg data-dna-fixed>
  <header class="site-nav">
    <a class="site-nav-logo" href="index.html" aria-label="ExP Lab home"><img class="logo-fade" src="images/research_rbf.png" alt="" /><img class="logo-fade" src="images/research_helix.png" alt="" /><img class="logo-fade" src="images/research_jablonski.png" alt="" /></a>
    <label class="motion-switch site-nav-motion-mobile" title="Toggle animations"><input type="checkbox" id="motionCheckboxMobile" checked aria-label="Animations"><span class="motion-slider"></span></label>
    <button type="button" class="site-nav-burger" id="siteNavBurger" aria-label="Menu" aria-expanded="false" aria-controls="siteNavMenu"><svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true" focusable="false"><path class="hb-curve" d="M7 6 Q24 74 41 6" stroke-width="2.5"/><line class="hb-l1" x1="16" y1="33" x2="32" y2="33" stroke-width="4"/><line class="hb-l2" x1="12.5" y1="23" x2="35.5" y2="23" stroke-width="4"/><line class="hb-l3" x1="9.5" y1="13" x2="38.5" y2="13" stroke-width="4"/></svg></button>
    <ul class="site-nav-menu" id="siteNavMenu">
      <li class="motion-switch-item"><span class="motion-label">Motion: <span class="motion-label-state" id="motionLabelState">On</span></span>
        <label class="motion-switch" title="Toggle animations (applies across the whole site)"><input type="checkbox" id="motionCheckbox" checked aria-label="Animations"><span class="motion-slider"></span></label></li>
      <li><a href="index.html">Home</a></li><li><a href="research.html">Research</a></li><li><a href="index.html#s4">Team</a></li><li><a href="publications.html">Publications</a></li><li><a href="join.html">Join</a></li>
    </ul>
  </header>

  <main>
    <h1>News</h1>
    <p class="intro">Recent papers, people, talks and funding from the group. Publications are listed <a href="publications.html">here</a>.</p>
    <div class="news-list" id="newsList"></div>
  </main>
  <script src="data/news.js" defer></script>
  <script type="module">
    import { initDnaBackground } from './js/dna-bg.js';
    try { initDnaBackground(); } catch (e) { console.warn(e); }
    import { getStoredMotionPreference, setStoredMotionPreference } from './js/motion-state.js';
    const checkbox = document.getElementById('motionCheckbox');
    const labelState = document.getElementById('motionLabelState');
    const enabled = getStoredMotionPreference();
    if (checkbox) checkbox.checked = enabled;
    if (labelState) labelState.textContent = enabled ? 'On' : 'Off';
    checkbox?.addEventListener('change', () => {
      setStoredMotionPreference(checkbox.checked);
      if (labelState) labelState.textContent = checkbox.checked ? 'On' : 'Off';
    });

    import { renderNewsArchive } from './js/news-render.js';
    renderNewsArchive(document.getElementById('newsList'));
  </script>
<script src="js/subnav.js" defer></script>
<footer class="site-footer">© 2026 Jeffrey Gorman. All rights reserved.</footer>
</body>
</html>
