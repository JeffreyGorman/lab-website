          <polygon fill="var(--pah-face)" stroke="var(--pah-edge)" stroke-width="2" 
                   points="1,-134.26 1,-180.19 40.08,-203.64 40.31,-243.24 83.52,-269.36 119.71,-248.73 165.04,-276.42 164.91,-316.35 215.58,-345.61 251.78,-324.98 300.79,-353.28 337.62,-332.12 337.61,-285.52 299.64,-262.74 299.74,-221.09 252.01,-192.83 215.04,-213.9 174.22,-190.33 174.1,-147.84 127.5,-120.94 90.53,-142.01 39.32,-112.44 1,-134.26"/>
