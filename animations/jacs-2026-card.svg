            <line x1="265.78" y1="-829.09" x2="1" y2="-981.96"/>
            <line x1="250.78" y1="-803.1" x2="-14.01" y2="-955.97"/>
          </g>
        </g>
      </defs>

  <ellipse cx="600" cy="344.3" rx="230" ry="26" fill="#3a2a5c" opacity="0">
    <animate attributeName="opacity" values="0;0.16" begin="1.2s" dur="0.9s" fill="freeze"/>
  </ellipse>
  <!-- LAYERS: each shape is re-centred on its own middle, then placed at (CX, y). Painted bottom to top.
       Final centres: CX=600, y = -200, -100, 0, 100, 200 (pitch 100). Glow overlays sit inside each layer so layers in front hide them correctly. -->
  <g transform="translate(600,44)"><!-- Por -->
    <animateTransform attributeName="transform" type="translate" begin="1s" dur="1s" fill="freeze"
      values="600,44; 600,200" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    <g transform="translate(-191.3,-15.3)">
      <use href="#pah-por"/>
    </g>
  </g>
  <g transform="translate(600,22)"><!-- pPDI -->
    <animateTransform attributeName="transform" type="translate" begin="1s" dur="1s" fill="freeze"
      values="600,22; 600,100" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    <g transform="translate(-169.3,229)">
      <use href="#pah-ppdi-1"/>
      <polygon points="1,-134.3 1,-180.2 40.1,-203.6 40.3,-243.2 83.5,-269.4 119.7,-248.7 165,-276.4 164.9,-316.4 215.6,-345.6 251.8,-325 300.8,-353.3 337.6,-332.1 337.6,-285.5 299.6,-262.7 299.7,-221.1 252,-192.8 215,-213.9 174.2,-190.3 174.1,-147.8 127.5,-120.9 90.5,-142 39.3,-112.4 1,-134.3" fill="var(--honeycomb-bullet-active-energy)" opacity="0" stroke="none">
        <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0.000;0.214;0.643;1.000" begin="6s" dur="1.4s" fill="freeze"/>
      </polygon>
    </g>
  </g>
  <g transform="translate(600,0)"><!-- pPDI -->
    <g transform="translate(-169.3,491.4)">
      <use href="#pah-ppdi-2"/>
      <polygon points="1,-396.7 1,-442.6 40.1,-466.1 40.3,-505.7 83.5,-531.8 119.7,-511.1 165,-538.8 164.9,-578.8 215.6,-608 251.8,-587.4 300.8,-615.7 337.6,-594.5 337.6,-548 299.6,-525.2 299.7,-483.5 252,-455.2 215,-476.3 174.2,-452.8 174.1,-410.3 127.5,-383.4 90.5,-404.4 39.3,-374.9 1,-396.7" fill="var(--honeycomb-bullet-active-energy)" opacity="0" stroke="none">
        <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0.000;0.250;0.750;1.000" begin="5.1s" dur="1.2s" fill="freeze"/>
      </polygon>
    </g>
  </g>
  <g transform="translate(600,-22)"><!-- pPDI -->
    <animateTransform attributeName="transform" type="translate" begin="1s" dur="1s" fill="freeze"
      values="600,-22; 600,-100" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    <g transform="translate(-169.3,753.3)">
      <use href="#pah-ppdi-3"/>
      <polygon points="1,-658.5 1,-704.5 40.1,-727.9 40.3,-767.5 83.5,-793.6 119.7,-773 165,-800.7 164.9,-840.6 215.6,-869.9 251.8,-849.3 300.8,-877.6 337.6,-856.4 337.6,-809.8 299.6,-787 299.7,-745.4 252,-717.1 215,-738.2 174.2,-714.6 174.1,-672.1 127.5,-645.2 90.5,-666.3 39.3,-636.7 1,-658.5" fill="var(--honeycomb-bullet-active-energy)" opacity="0" stroke="none">
        <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0.000;0.250;0.750;1.000" begin="4.2s" dur="1.2s" fill="freeze"/>
      </polygon>
    </g>
  </g>
  <g transform="translate(600,-44)"><!-- oPDI -->
    <animateTransform attributeName="transform" type="translate" begin="1s" dur="1s" fill="freeze"
      values="600,-44; 600,-200" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    <g transform="translate(-169.3,1019.4)">
      <use href="#pah-opdi"/>
      <polygon points="1,-924.8 1,-970.8 40.1,-994.2 40.3,-1033.8 83.5,-1059.9 119.7,-1039.3 165,-1067 164.9,-1106.9 215.6,-1136.2 251.8,-1115.5 300.8,-1143.8 337.6,-1122.7 337.6,-1076.1 299.6,-1053.3 299.7,-1011.7 252,-983.4 215,-1004.5 174.2,-980.9 174.1,-938.4 127.5,-911.5 90.5,-932.6 39.3,-903 1,-924.8" fill="var(--honeycomb-bullet-active-photon)" opacity="0" stroke="none">
        <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0.000;0.250;0.750;1.000" begin="3.3s" dur="1.2s" fill="freeze"/>
      </polygon>
    </g>
  </g>

  <!-- LABELS -->

  <!-- 3.5 A: same feature on the top two layers -->
  <g opacity="0" display="none">
    <animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.5s" fill="freeze"/>
    <line x1="780.3" y1="-276" x2="902.3" y2="-276" stroke="var(--pah-line)" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="780.3" y1="-176" x2="902.3" y2="-176" stroke="var(--pah-line)" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="888.3" y1="-276" x2="888.3" y2="-176" stroke="var(--pah-line)" stroke-width="2"/>
    <path d="M 888.3 -276 L 882.3 -262 L 894.3 -262 Z" fill="var(--pah-line)"/>
    <path d="M 888.3 -176 L 882.3 -190 L 894.3 -190 Z" fill="var(--pah-line)"/>
    <text x="922.3" y="-218" class="pah-dim" aria-hidden="true" style="font-size:40px;fill:#512940">3.5 Å</text>
  </g>

  <!-- PHOTON (photon-absorbed colour) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.6;1" begin="2.8s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-33.5,-21.8; 0,0" keyTimes="0;1" begin="2.8s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <g transform="translate(374.2,-319.6) rotate(33)">
      <path d="M0 0 q10 -13 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" stroke="var(--honeycomb-bullet-active-photon)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M134 -11 L150 0 L134 11 Z" fill="var(--honeycomb-bullet-active-photon)"/>
    </g>
  </g>

  <!-- CHARGE TRANSFER (charge-transfer colour): electron slides from the porphyrin onto the neighbouring pPDI, leaving a hole -->
  <g transform="translate(530,251.8)" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="530,251.8; 530,145.9" begin="6.9s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0;1" begin="6.9s" dur="0.15s" fill="freeze"/>
    <circle r="19" fill="var(--honeycomb-bullet-active-electron)" stroke="var(--pah-face)" stroke-width="4"/><line x1="-9" y1="0" x2="9" y2="0" stroke="var(--pah-face)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(530,251.8)" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="7.2s" dur="0.3s" fill="freeze"/>
    <circle r="19" fill="var(--pah-face)" stroke="#b22d64" stroke-width="4"/><line x1="-9" y1="0" x2="9" y2="0" stroke="#b22d64" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-9" x2="0" y2="9" stroke="#b22d64" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle cx="530" cy="251.8" r="19" fill="none" stroke="#b22d64" stroke-width="3" opacity="0">
    <animate attributeName="r" values="19;49.4" begin="7.5s" dur="0.9s" fill="freeze"/>
    <animate attributeName="opacity" values="0.7;0" begin="7.5s" dur="0.9s" fill="freeze"/>
  </circle>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.5s" fill="freeze"/><text class="pah-label" aria-hidden="true" style="font-size:40px;fill:#512940"><tspan x="14" y="222">semiconductor–</tspan><tspan x="14" y="268">DNA conjugation</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.5s" fill="freeze"/><text class="pah-label" aria-hidden="true" style="font-size:40px;fill:#512940"><tspan x="14" y="-6">DNA assembly</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.0s" dur="0.5s" fill="freeze"/><text class="pah-label" aria-hidden="true" style="font-size:40px;fill:#512940"><tspan x="880" y="-6">exciton</tspan><tspan x="880" y="40">evolution</tspan></text></g>
</svg>
