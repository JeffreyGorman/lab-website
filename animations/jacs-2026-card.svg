                   points="1,-920.82 1,-966.76 40.08,-990.2 40.31,-1029.81 83.52,-1055.93 119.71,-1035.3 165.04,-1062.98 164.91,-1102.92 215.58,-1132.18 251.78,-1111.55 300.79,-1139.85 337.62,-1118.69 337.61,-1072.09 299.64,-1049.31 299.74,-1007.66 252.01,-979.4 215.04,-1000.47 174.22,-976.9 174.1,-934.41 127.5,-907.51 90.53,-928.58 39.32,-899.01 1,-920.82"/>
          <polygon fill="var(--pah-face-o)" stroke="var(--pah-edge)" stroke-width="2" 
