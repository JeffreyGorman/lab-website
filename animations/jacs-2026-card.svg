            <line x1="400.83" y1="-1062.99" x2="136.05" y2="-1215.86"/>
            <line x1="385.82" y1="-1037" x2="121.04" y2="-1189.87"/>
            <line x1="370.82" y1="-1011.01" x2="106.04" y2="-1163.88"/>
            <line x1="355.81" y1="-985.02" x2="91.03" y2="-1137.89"/>
            <line x1="340.81" y1="-959.03" x2="76.03" y2="-1111.91"/>
            <line x1="325.8" y1="-933.04" x2="61.02" y2="-1085.92"/>
            <line x1="310.8" y1="-907.05" x2="46.02" y2="-1059.93"/>
            <line x1="235.77" y1="-777.11" x2="-29.01" y2="-929.98"/>
            <line x1="220.77" y1="-751.12" x2="-44.02" y2="-903.99"/>
            <line x1="205.76" y1="-725.13" x2="-59.02" y2="-878"/>
            <line x1="190.76" y1="-699.14" x2="-74.03" y2="-852.01"/>
