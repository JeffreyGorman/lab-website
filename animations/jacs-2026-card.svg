                d="M293.62,-6.97l28.51-35.02-30.85-33.16-40.43,10.54-32.54-17.35-41.22,11.45-35.02-20.44-44.32,28.82,7.75,31.61-26.65,35.02,8.06,32.23-26.34,33.78,27.79,34.4,44.41-11.76,32.34,19.3,41.11-10.33,36.26,19.52,45.98-28.82-11.05-34.71,26.15-30.06-9.94-35.02ZM267.07,48.92l-47.11,3.25-18.28,39.26-32.92,9.39-26.28-19.05,2.17-35.95-41.29-13.64-6.03-25.58,21.38-27.1,42.04-2.38,19.83-34.85,33.78-9.9,25.1,16.13-1.55,39.67,40.91,10.23,9.62,27.58-21.4,22.93Z"/>
        </g>
  
