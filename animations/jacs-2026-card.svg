<svg class="pah-card-svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="1 -389.6 1177 735.9" role="img" aria-labelledby="pahCardTitle pahCardDesc"><title id="pahCardTitle">Photoexcitation, energy transfer and charge transfer in a DNA-assembled stack of chromophores</title>
  <desc id="pahCardDesc">The position of each chromophore in the stack is encoded by DNA. A photon is absorbed by the top chromophore, oPDI (an ortho-arylated perylene diimide). The excited state then moves by energy transfer down through three pPDI (phenoxy-functionalised perylene diimide) layers, and charge transfer follows onto the neighbouring porphyrin at the bottom.</desc>
